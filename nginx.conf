user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/rdf+xml application/yaml image/svg+xml;
    gzip_min_length 256;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js)$ {
            add_header Cache-Control "public, max-age=3600" always;
        }

        # Restored: correct content types for the schema/pipeline assets.
        location ~* \.ttl$ {
            default_type application/turtle;
        }

        location ~* \.ya?ml$ {
            default_type application/yaml;
        }

        # Block dotfiles and backup files.
        location ~ /\. {
            deny all;
        }
        location ~ ~$ {
            deny all;
        }
    }
}
