user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/rdf+xml application/yaml image/svg+xml;
    gzip_min_length 256;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------
        # Hardened runtime security headers
        # -----------------------------------------------------------

        # Content-Security-Policy: dependency-free dashboard, so we
        # keep this tight — no remote script/style/font origins.
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data:; \
             connect-src 'self'; \
             font-src 'self'; \
             object-src 'none'; \
             base-uri 'self'; \
             form-action 'self'; \
             frame-ancestors 'none'" always;

        # Prevent this site from being framed by any origin (clickjacking).
        add_header X-Frame-Options "DENY" always;

        # Legacy browsers without CSP frame-ancestors support.
        add_header X-Content-Type-Options "nosniff" always;

        # Restrict powerful browser features by default.
        add_header Permissions-Policy
            "geolocation=(), microphone=(), camera=(), payment=(), usb=(), \
             magnetometer=(), gyroscope=(), fullscreen=(self)" always;

        # Referrer hygiene.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # HSTS — only meaningful when actually served over TLS in front
        # of this container (e.g. via a reverse proxy or LB); harmless
        # otherwise but should be removed if you never serve HTTPS.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # -----------------------------------------------------------
        # Static asset caching
        # -----------------------------------------------------------

        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Web4 IoT model/schema assets served as their proper content types.
        location ~* \.ttl$ {
            default_type application/turtle;
        }

        location ~* \.ya?ml$ {
            default_type application/yaml;
        }

        # -----------------------------------------------------------
        # SPA-style fallback for the dashboard
        # -----------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Block access to dotfiles and backup files.
        location ~ /\. {
            deny all;
        }
        location ~ ~$ {
            deny all;
        }
    }
}
