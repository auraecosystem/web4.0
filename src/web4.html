<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web4 Search</title>
  <style>
    /* Reset & Base Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Styling */
    header {
      padding: 20px;
      border-bottom: 1px solid #1e293b;
      background-color: #0f172a;
    }

    header div {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header img {
      height: 40px;
      width: auto;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #38bdf8;
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 20px;
    }

    /* Search Component */
    .search-container {
      position: relative;
      width: 100%;
      max-width: 640px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    #web4-search {
      width: 100%;
      padding: 16px 48px 16px 18px;
      font-size: 1rem;
      border: 1px solid #334155;
      border-radius: 12px;
      background-color: #0f172a;
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #web4-search:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .search-spinner {
      position: absolute;
      right: 16px;
      width: 20px;
      height: 20px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .suggestions-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 6px 0;
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 50;
    }

    .suggestion-item {
      padding: 12px 18px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .suggestion-item strong {
      color: #38bdf8;
    }

    .suggestion-item.active,
    .suggestion-item:hover {
      background-color: #334155;
      color: #f8fafc;
    }
    .search-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 640px;
}

@media (min-width: 640px) {
  .search-section {
    flex-direction: row;
    align-items: flex-start;
  }
}

/* Multi-Select Dropdown Integration Styles */
.multi-select-container {
  position: relative;
  min-width: 180px;
}

.multi-select-trigger {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  min-height: 52px;
  padding: 6px 12px;
  border: 1px solid #334155;
  border-radius: 12px;
  background-color: #0f172a;
  color: #f8fafc;
  cursor: pointer;
}

.multi-select-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #0284c7;
  color: #ffffff;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 13px;
}

.multi-select-chip span {
  cursor: pointer;
  font-weight: bold;
}

.multi-select-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 220px;
  overflow-y: auto;
  border: 1px solid #334155;
  border-radius: 12px;
  background-color: #1e293b;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
  z-index: 60;
}

.multi-select-container.open .multi-select-dropdown {
  display: block;
}

.multi-select-option {
  padding: 10px 14px;
  color: #94a3b8;
  cursor: pointer;
}

.multi-select-option:hover {
  background: #334155;
  color: #f8fafc;
}

.multi-select-option.selected {
  background: #0284c7;
  color: #ffffff;
}

    /* Footer */
    footer {
      padding: 24px;
      text-align: center;
      border-top: 1px solid #1e293b;
      font-size: 0.875rem;
      color: #64748b;
      background-color: #0f172a;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <img alt="FLÜÜK PÊ Logo" src="flukpe-logo.png">
      <h1>web4 Search</h1>
    </div>
  </header>

  <main>
    <div class="search-container">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          id="web4-search" 
          placeholder="Search Web4 decentralized nodes, DID, IPFS..." 
          autocomplete="off" 
          aria-expanded="false" 
          aria-autocomplete="list" 
          aria-controls="suggestions-list"
        />
        <span class="search-spinner" id="search-spinner" hidden></span>
      </div>
      <ul id="suggestions-list" class="suggestions-dropdown" role="listbox" hidden></ul>
    </div>
  </main>
<main>
  <div class="search-section">
    <!-- Multi-Select Category Filter -->
    <select id="web4-filters" data-placeholder="Filter Categories" multiple data-multi-select>
      <option value="ipfs" selected>IPFS</option>
      <option value="did" selected>DIDs</option>
      <option value="contracts">Smart Contracts</option>
      <option value="ens">ENS Domains</option>
      <option value="storage">Decentralized Storage</option>
    </select>

    <!-- Web4 Search Bar -->
    <div class="search-container">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          id="web4-search" 
          placeholder="Search Web4 decentralized nodes, DID, IPFS..." 
          autocomplete="off" 
          aria-expanded="false" 
          aria-autocomplete="list" 
          aria-controls="suggestions-list"
        />
        <span class="search-spinner" id="search-spinner" hidden></span>
      </div>
      <ul id="suggestions-list" class="suggestions-dropdown" role="listbox" hidden></ul>
    </div>
  </div>
</main>
  <footer>
    © 2026 web4
  </footer>

  <script>
    const searchInput = document.getElementById('web4-search');
    const suggestionsList = document.getElementById('suggestions-list');
    const spinner = document.getElementById('search-spinner');

    let debounceTimer;
    let activeIndex = -1;

    // Simulated Web4 lookup endpoint
    async function fetchWeb4Suggestions(query) {
      const mockData = [
        "ipfs://bafybeickg...",
        "did:key:z6MkpTHR...",
        "FLÜÜK PÊ Decentralized Storage",
        "Web4 Smart Contracts Overview",
        "Ethereum Name Service (ENS) Resolver",
        "Libp2p Peer Routing Table"
      ];

      await new Promise(res => setTimeout(res, 180));
      return mockData.filter(item => item.toLowerCase().includes(query.toLowerCase()));
    }

    function debounce(func, delay = 200) {
      return (...args) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => func(...args), delay);
      };
    }

    function renderSuggestions(items, query) {
      suggestionsList.innerHTML = '';
      activeIndex = -1;

      if (!items.length || !query) {
        suggestionsList.hidden = true;
        searchInput.setAttribute('aria-expanded', 'false');
        return;
      }

      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'suggestion-item';
        li.role = 'option';
        li.id = `suggestion-${index}`;
        li.innerHTML = item.replace(regex, '<strong>$1</strong>');

        li.addEventListener('click', () => selectSuggestion(item));
        suggestionsList.appendChild(li);
      });

      suggestionsList.hidden = false;
      searchInput.setAttribute('aria-expanded', 'true');
    }

    function selectSuggestion(text) {
      searchInput.value = text;
      suggestionsList.hidden = true;
      searchInput.setAttribute('aria-expanded', 'false');
    }

    searchInput.addEventListener('input', debounce(async (e) => {
      const query = e.target.value.trim();

      if (!query) {
        renderSuggestions([], '');
        return;
      }

      spinner.hidden = false;
      const results = await fetchWeb4Suggestions(query);
      spinner.hidden = true;

      renderSuggestions(results, query);
    }));

    searchInput.addEventListener('keydown', (e) => {
      const items = suggestionsList.querySelectorAll('.suggestion-item');
      if (suggestionsList.hidden || !items.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = (activeIndex + 1) % items.length;
        updateActiveItem(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = (activeIndex - 1 + items.length) % items.length;
        updateActiveItem(items);
      } else if (e.key === 'Enter' && activeIndex >= 0) {
        e.preventDefault();
        selectSuggestion(items[activeIndex].textContent);
      } else if (e.key === 'Escape') {
        suggestionsList.hidden = true;
        searchInput.setAttribute('aria-expanded', 'false');
      }
    });

    function updateActiveItem(items) {
      items.forEach((item, idx) => {
        const isActive = idx === activeIndex;
        item.classList.toggle('active', isActive);
        if (isActive) {
          item.scrollIntoView({ block: 'nearest' });
          searchInput.setAttribute('aria-activedescendant', item.id);
        }
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        suggestionsList.hidden = true;
        searchInput.setAttribute('aria-expanded', 'false');
      }
    });
    // Initialize Multi-Select Dropdown for Web4 Filters
document.querySelectorAll('select[data-multi-select]').forEach(select => {
  select.style.display = 'none';

  const container = document.createElement('div');
  container.className = 'multi-select-container';

  const trigger = document.createElement('div');
  trigger.className = 'multi-select-trigger';

  const dropdown = document.createElement('div');
  dropdown.className = 'multi-select-dropdown';

  const placeholder = select.dataset.placeholder || 'Select filters';

  function updateTrigger() {
    trigger.innerHTML = '';
    const selectedOptions = Array.from(select.selectedOptions);

    if (selectedOptions.length === 0) {
      trigger.innerHTML = `<span style="color: #64748b;">${placeholder}</span>`;
      return;
    }

    selectedOptions.forEach(opt => {
      const chip = document.createElement('span');
      chip.className = 'multi-select-chip';
      chip.textContent = opt.text;

      const removeBtn = document.createElement('span');
      removeBtn.innerHTML = '&times;';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        opt.selected = false;
        select.dispatchEvent(new Event('change'));
      };

      chip.appendChild(removeBtn);
      trigger.appendChild(chip);
    });
  }

  Array.from(select.options).forEach(opt => {
    const item = document.createElement('div');
    item.className = 'multi-select-option';
    item.textContent = opt.text;
    if (opt.selected) item.classList.add('selected');

    item.addEventListener('click', (e) => {
      e.stopPropagation();
      opt.selected = !opt.selected;
      item.classList.toggle('selected', opt.selected);
      select.dispatchEvent(new Event('change'));
    });

    dropdown.appendChild(item);
  });

  trigger.addEventListener('click', () => container.classList.toggle('open'));

  document.addEventListener('click', (e) => {
    if (!container.contains(e.target)) container.classList.remove('open');
  });

  select.addEventListener('change', updateTrigger);

  container.appendChild(trigger);
  container.appendChild(dropdown);
  select.parentNode.insertBefore(container, select);
  
  updateTrigger();
});
  </script>
</body>
</html>
